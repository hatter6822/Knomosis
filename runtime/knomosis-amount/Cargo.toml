# `knomosis-amount` — the workspace's 256-bit unsigned accounting scalar.
#
# The kernel's credit ceiling is `Laws.maxAmount = 256^32 = 2^256`
# (`LegalKernel/Laws/AmountBound.lean`), so a kernel-legal balance is
# exactly a 256-bit unsigned integer.  Every Rust crate that carries a
# balance, a budget, a pool level or a deposit leg represents it with
# this crate's [`Amount`], so the host workspace can hold precisely what
# the kernel admits — no narrower, and no wider.
#
# Lives in its own crate rather than in `knomosis-storage` or
# `knomosis-cli-common` because BOTH the read side (indexer, gateway,
# observer — all of which depend on `knomosis-storage`) and the write
# side (`knomosis-l1-ingest`, `knomosis-host` — which do not) need it.
# It depends on nothing but the arithmetic engine, so it can sit below
# every one of them without a cycle.

[package]
name = "knomosis-amount"
description = "256-bit unsigned accounting scalar for the Knomosis Rust host runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Standard rlib only.  No C-ABI surface, no proc-macro, no cdylib.
path = "src/lib.rs"

[dependencies]
# The arithmetic engine.  Already in the dependency graph transitively
# via `k256` (RH-A's ECDSA adaptor), so promoting it to a direct
# dependency adds no new code to the build — see
# `docs/audits/gateway_dependency_audit.md`.
#
# `default-features = false` drops the default `rand` feature (which
# pulls `rand_core/std`); this crate needs only the const-generic
# `Uint` arithmetic.  Note feature unification means `k256`'s own
# feature selection still applies to the compiled crate — turning them
# off here states OUR requirement, it does not narrow theirs.
#
# The `serde` feature is deliberately NOT enabled: it pulls `serdect`,
# and `Amount` serialises as a DECIMAL STRING (the §6.2 gateway
# convention) rather than in `crypto-bigint`'s own representation, so
# the impl is written here against `serde` directly.
crypto-bigint = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mirrors every other crate in the workspace: `missing_docs` is already
# required at the rustc level (see `lib.rs`), so the pedantic
# fallible-function variants are redundant for our discipline.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
